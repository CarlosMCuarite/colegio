name: Mantener base de datos SIGE activa

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Consultar PostgreSQL mediante el backend
        run: |
          curl --fail-with-body --retry 3 --retry-delay 10 \
            "https://sige-backend-wzmn.onrender.com/api/v1/health/database"
